[project]
name = "opendial"
version = "0.0.1"
description = "Test your voice agents like you test your code."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Moses Adebayo", email = "adebayomoses597@gmail.com" }]
requires-python = ">=3.10"
keywords = ["voice-ai", "testing", "livekit", "pipecat", "llm"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Testing",
]
dependencies = []

[project.urls]
Repository = "https://github.com/mosessmax/opendial"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/opendial"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
